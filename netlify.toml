[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
